<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitForge — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/mithril@2.2.2/mithril.min.js"></script>

<style>
:root{--bg:#090C10;--bg2:#0F1319;--card:#151B27;--card-h:#1B2233;--border:#232D40;--text:#E4E8ED;--text2:#6E7F99;--text3:#3E4C63;--accent:#00E676;--accent-d:rgba(0,230,118,.12);--warn:#FFB300;--danger:#FF5252;--info:#40C4FF;--purple:#B388FF;--orange:#FF6D00;--r:12px;--rs:8px;--sh:0 4px 24px rgba(0,0,0,.4);--font-d:'Outfit',sans-serif;--font-b:'DM Sans',sans-serif;--sidebar-w:260px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
h1,h2,h3,h4,h5,h6{font-family:var(--font-d);font-weight:700;line-height:1.2}
button{font-family:var(--font-b);cursor:pointer;border:none;outline:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font-b);background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:9px 13px;width:100%;transition:border .2s;font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
select option{background:var(--bg2);color:var(--text)}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.sidebar .brand{padding:24px 20px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.sidebar .brand .logo{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),#009E4F);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:900;font-size:16px;color:#090C10;flex-shrink:0}
.sidebar .brand span{font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:-.3px}
.sidebar .brand small{display:block;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.sidebar nav{flex:1;padding:12px 10px}
.sidebar .nav-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:16px 12px 6px}
.sidebar .nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;margin-bottom:2px;text-align:left}
.sidebar .nav-btn:hover{background:var(--card);color:var(--text)}
.sidebar .nav-btn.active{background:var(--accent-d);color:var(--accent);font-weight:600}
.sidebar .nav-btn i{width:18px;text-align:center;font-size:14px}
.sidebar .nav-btn .count{margin-left:auto;background:var(--card);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:var(--text3)}
.sidebar .nav-btn.active .count{background:rgba(0,230,118,.2);color:var(--accent)}
.main{margin-left:var(--sidebar-w);flex:1;padding:28px 32px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.topbar h1{font-size:26px;font-weight:800}
.topbar p{color:var(--text2);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card-flat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--rs);font-weight:600;font-size:13px;transition:all .15s;justify-content:center;white-space:nowrap}
.btn-primary{background:var(--accent);color:#090C10}.btn-primary:hover{background:#00F080;box-shadow:0 0 20px rgba(0,230,118,.25)}
.btn-secondary{background:var(--bg2);border:1px solid var(--border);color:var(--text)}.btn-secondary:hover{border-color:var(--text2)}
.btn-danger{background:rgba(255,82,82,.12);color:var(--danger);border:1px solid rgba(255,82,82,.2)}.btn-danger:hover{background:rgba(255,82,82,.22)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--border);font-size:13px;transition:all .15s}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn-block{width:100%}
.btn-lg{padding:14px 28px;font-size:15px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.tag-green{background:var(--accent-d);color:var(--accent)}
.tag-orange{background:rgba(255,109,0,.12);color:var(--orange)}
.tag-red{background:rgba(255,82,82,.12);color:var(--danger)}
.tag-blue{background:rgba(64,196,255,.12);color:var(--info)}
.tag-purple{background:rgba(179,136,255,.12);color:var(--purple)}
.tag-yellow{background:rgba(255,179,0,.12);color:var(--warn)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--bg2)}
th{padding:12px 16px;text-align:left;font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--card-h)}
tbody tr:last-child td{border-bottom:none}
.table-actions{display:flex;gap:6px;justify-content:flex-end}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:16px}
.stat-card .sc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-card .sc-val{font-family:var(--font-d);font-size:26px;font-weight:800;line-height:1}
.stat-card .sc-label{font-size:11px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;position:relative}
.modal.wide{max-width:720px}
.modal h3{font-size:20px;font-weight:800;margin-bottom:20px;padding-right:32px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.toolbar .search-box{position:relative;flex:1;max-width:320px}
.toolbar .search-box input{padding-left:36px}
.toolbar .search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px}
.toolbar .filter-select{min-width:150px}
.toast-container{position:fixed;top:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{padding:13px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;animation:slideIn .3s ease;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;min-width:260px}
.toast-success{background:#0D2818;border:1px solid rgba(0,230,118,.3);color:var(--accent)}
.toast-error{background:#2D0D0D;border:1px solid rgba(255,82,82,.3);color:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.fade-up{animation:fadeUp .4s ease both}
.pagination{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:16px}
.pg-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--rs);font-size:12px;font-weight:600;background:var(--bg2);border:1px solid var(--border);color:var(--text2);transition:all .15s}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);color:#090C10;border-color:var(--accent)}
.pg-info{font-size:12px;color:var(--text3);margin-right:8px}
.confirm-body{text-align:center;padding:10px 0}
.confirm-body i{font-size:48px;margin-bottom:16px;display:block}
.confirm-body h4{font-size:18px;margin-bottom:8px}
.confirm-body p{color:var(--text2);font-size:14px;margin-bottom:24px}
.confirm-actions{display:flex;gap:10px;justify-content:center}
@media(max-width:1100px){.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:16px}.stats-row{grid-template-columns:1fr 1fr}.form-row,.form-row-3,.form-row-4{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.toolbar .search-box{max-width:100%}}
</style>
</head>

function initDB(){
  return db.admins.count().then(function(c){
    if(c===0) return db.transaction('rw',db.admins,db.trainers,db.users,db.workouts,db.exercises,db.foods,db.meals,db.healthEntries,db.billing,function(){
      db.admins.bulkAdd(SEED.admins);db.trainers.bulkAdd(SEED.trainers);db.users.bulkAdd(SEED.users);
      db.workouts.bulkAdd(SEED.workouts);db.exercises.bulkAdd(SEED.exercises);db.foods.bulkAdd(SEED.foods);
      db.meals.bulkAdd(SEED.meals);db.healthEntries.bulkAdd(SEED.healthEntries);db.billing.bulkAdd(SEED.billing);
    });
  });
}

var state={route:'dashboard',modal:null,confirm:null,toasts:[],search:{},filters:{},pages:{admins:1,trainers:1,users:1,workouts:1,foods:1,meals:1,healthEntries:1,billing:1},pageSize:8};

function showToast(msg,type){type=type||'success';var id=Date.now();state.toasts.push({id:id,msg:msg,type:type});m.redraw();setTimeout(function(){state.toasts=state.toasts.filter(function(t){return t.id!==id;});m.redraw();},3000);}
function diffTag(d){if(d==='Beginner')return'tag-green';if(d==='Intermediate')return'tag-orange';if(d==='Advanced')return'tag-red';return'tag-blue';}
function statusTag(s){if(s==='Active'||s==='Paid')return'tag-green';if(s==='Suspended'||s==='Failed')return'tag-red';if(s==='Inactive')return'tag-yellow';if(s==='Refunded')return'tag-purple';return'tag-blue';}
function planTag(p){if(p==='Pro')return'tag-green';if(p==='Team')return'tag-blue';return'tag-yellow';}
function nav(r){state.route=r;m.redraw();window.scrollTo(0,0);}
function openModal(t,d){state.modal={type:t,data:d?JSON.parse(JSON.stringify(d)):null};m.redraw();}
function closeModal(){state.modal=null;m.redraw();}
function openConfirm(m,fn){state.confirm={msg:m,onConfirm:fn};m.redraw();}
