<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitForge — Workout & Nutrition Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/mithril@2.2.2/mithril.min.js"></script>
<script src="https://unpkg.com/dexie@3.2.7/dist/dexie.js"></script>

<style>
:root{
  --bg:#0B0E13;--bg2:#111621;--card:#171D2A;--card-h:#1E2538;
  --border:#252D3F;--text:#E8ECF1;--text2:#7A8BA7;--text3:#4A5568;
  --accent:#00E676;--accent-d:rgba(0,230,118,.12);--accent2:#FF6D00;
  --danger:#FF5252;--info:#40C4FF;--purple:#B388FF;
  --r:14px;--rs:8px;--rl:20px;--sh:0 4px 24px rgba(0,0,0,.35);
  --nav-h:68px;--font-d:'Outfit',sans-serif;--font-b:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
h1,h2,h3,h4,h5,h6{font-family:var(--font-d);font-weight:700;line-height:1.2}
a{color:inherit;text-decoration:none}
button{font-family:var(--font-b);cursor:pointer;border:none;outline:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font-b);background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:10px 14px;width:100%;transition:border .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.app-wrap{display:flex;min-height:100vh;max-width:1400px;margin:0 auto}
.sidebar{width:72px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:16px 0;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.sidebar .logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#00B060);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:900;font-size:18px;color:#0B0E13;margin-bottom:28px;flex-shrink:0}
.sidebar nav{flex:1;display:flex;flex-direction:column;gap:4px;width:100%;padding:0 10px}
.nav-btn{width:52px;height:52px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--text3);transition:all .2s;position:relative}
.nav-btn:hover{color:var(--text2);background:var(--card)}
.nav-btn.active{color:var(--accent);background:var(--accent-d)}
.nav-btn .badge{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--bg2)}
.main{flex:1;margin-left:72px;padding:24px 28px 100px;min-height:100vh}
.page-header{margin-bottom:24px}
.page-header h1{font-size:28px;font-weight:800}
.page-header p{color:var(--text2);margin-top:4px;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:all .25s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh)}
.card-flat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--rs);font-weight:600;font-size:14px;transition:all .2s;justify-content:center}
.btn-primary{background:var(--accent);color:#0B0E13}.btn-primary:hover{background:#00F080;box-shadow:0 0 20px rgba(0,230,118,.3)}
.btn-secondary{background:var(--bg2);border:1px solid var(--border);color:var(--text)}.btn-secondary:hover{border-color:var(--text2)}
.btn-danger{background:rgba(255,82,82,.15);color:var(--danger);border:1px solid rgba(255,82,82,.2)}.btn-danger:hover{background:rgba(255,82,82,.25)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-lg{padding:14px 28px;font-size:16px}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--border)}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tag-green{background:var(--accent-d);color:var(--accent)}
.tag-orange{background:rgba(255,109,0,.12);color:var(--accent2)}
.tag-blue{background:rgba(64,196,255,.12);color:var(--info)}
.tag-red{background:rgba(255,82,82,.12);color:var(--danger)}
.tag-purple{background:rgba(179,136,255,.12);color:var(--purple)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex}.flex-c{align-items:center}.flex-between{justify-content:space-between}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.text-accent{color:var(--accent)}.text-muted{color:var(--text2)}.text-sm{font-size:13px}.text-xs{font-size:11px}
.welcome-card{background:linear-gradient(135deg,#0D2818 0%,#132E1C 40%,#1A1D2A 100%);border:1px solid rgba(0,230,118,.15);border-radius:var(--rl);padding:28px;position:relative;overflow:hidden}
.welcome-card::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(0,230,118,.08),transparent 70%);border-radius:50%}
.welcome-card h2{font-size:24px;font-weight:800}.welcome-card p{color:var(--text2);margin-top:6px;font-size:14px}
.stat-card{position:relative;overflow:hidden}
.stat-card .stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-card .stat-val{font-family:var(--font-d);font-size:28px;font-weight:800;line-height:1}
.stat-card .stat-label{font-size:12px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.progress-ring{transform:rotate(-90deg)}
.water-dots{display:flex;gap:6px;flex-wrap:wrap}
.water-dot{width:28px;height:28px;border-radius:6px;background:var(--bg);border:1px solid var(--border);transition:all .2s;cursor:pointer}
.water-dot.filled{background:rgba(64,196,255,.2);border-color:var(--info);color:var(--info);display:flex;align-items:center;justify-content:center;font-size:12px}
.water-dot:hover{border-color:var(--info)}
.quick-actions{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.quick-actions::-webkit-scrollbar{display:none}
.quick-action{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:100px;scroll-snap-align:start;transition:all .2s;cursor:pointer}
.quick-action:hover{border-color:var(--accent);transform:translateY(-2px)}
.quick-action .qa-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.quick-action span{font-size:12px;font-weight:600;white-space:nowrap}
.workout-card{overflow:hidden;padding:0}
.workout-card .wc-img{height:160px;background-size:cover;background-position:center;position:relative}
.workout-card .wc-img .wc-diff{position:absolute;top:12px;right:12px}
.workout-card .wc-body{padding:16px}
.workout-card .wc-body h3{font-size:16px;font-weight:700;margin-bottom:8px}
.workout-card .wc-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.workout-card .wc-meta span{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.workout-card .wc-muscles{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.workout-card .wc-progress{margin-bottom:12px}
.workout-card .wc-actions{display:flex;gap:8px}
.layout-toggle{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden}
.layout-toggle button{padding:8px 14px;font-size:14px;color:var(--text3);transition:all .2s}
.layout-toggle button.active{background:var(--accent-d);color:var(--accent)}
.exercise-card{display:flex;gap:14px;align-items:flex-start}
.exercise-card .ex-thumb{width:64px;height:64px;border-radius:var(--rs);background:var(--bg2);background-size:cover;background-position:center;flex-shrink:0}
.exercise-card .ex-info{flex:1;min-width:0}
.exercise-card .ex-info h4{font-size:15px;font-weight:600;margin-bottom:4px}
.exercise-card .ex-stats{display:flex;gap:12px;flex-wrap:wrap}
.exercise-card .ex-stats span{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.player-wrap{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column}
.player-img{height:45vh;min-height:300px;background-size:cover;background-position:center;position:relative}
.player-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(transparent,var(--bg))}
.player-body{flex:1;padding:20px 24px 100px;overflow-y:auto}
.player-controls{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:16px 24px 32px;z-index:201}
.player-controls .ctrl-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.player-controls .ctrl-btn{min-width:64px;height:48px;border-radius:var(--rs);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.player-controls .ctrl-btn:active{transform:scale(.95)}
.celebration{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.celebration .confetti-canvas{position:absolute;inset:0;pointer-events:none}
.summary-stat{text-align:center}
.summary-stat .ss-val{font-family:var(--font-d);font-size:36px;font-weight:900}
.summary-stat .ss-label{font-size:12px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap{position:relative;height:220px}
.meal-card{display:flex;gap:14px;align-items:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);transition:all .2s;cursor:pointer}
.meal-card:hover{border-color:var(--accent)}
.meal-card .meal-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-card .meal-info{flex:1;min-width:0}
.meal-card .meal-info h4{font-size:15px;font-weight:600}
.meal-card .meal-info p{font-size:12px;color:var(--text2);margin-top:2px}
.meal-card .meal-cal{font-family:var(--font-d);font-weight:700;font-size:18px;flex-shrink:0}
.macro-ring{position:relative;display:flex;align-items:center;justify-content:center}
.macro-ring canvas{position:absolute}
.macro-ring .macro-val{font-family:var(--font-d);font-weight:800;font-size:20px;position:relative;z-index:1}
.macro-ring .macro-unit{font-size:11px;color:var(--text2);font-weight:400}
.health-card{display:flex;gap:14px;align-items:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .2s}
.health-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.health-card .hc-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.health-card .hc-info{flex:1}
.health-card .hc-info h4{font-size:15px;font-weight:600}
.health-card .hc-info p{font-size:13px;color:var(--text2);margin-top:2px}
.chat-layout{display:flex;gap:0;height:calc(100vh - 140px);background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.chat-list{width:300px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.chat-list .chat-item{display:flex;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.chat-item:hover,.chat-item.active{background:var(--card-h)}
.chat-item .chat-avatar{width:44px;height:44px;border-radius:50%;background:var(--bg2);background-size:cover;background-position:center;flex-shrink:0;position:relative}
.chat-item .chat-avatar .online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;background:var(--accent);border-radius:50%;border:2px solid var(--card)}
.chat-item .chat-preview{flex:1;min-width:0}
.chat-item .chat-preview h4{font-size:14px;font-weight:600}
.chat-item .chat-preview p{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-item .chat-time{font-size:11px;color:var(--text3);flex-shrink:0}
.chat-item .unread-badge{background:var(--accent);color:#0B0E13;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-main{flex:1;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.sent{align-self:flex-end;background:var(--accent);color:#0B0E13;border-bottom-right-radius:4px}
.msg.received{align-self:flex-start;background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .msg-time{font-size:10px;opacity:.6;margin-top:4px}
.msg-img{max-width:240px;border-radius:var(--rs);margin-top:6px}
.chat-input-wrap{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.chat-input-wrap input{flex:1}
.notif-item{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
.notif-item:hover{background:var(--card-h)}
.notif-item.unread{border-left:3px solid var(--accent)}
.notif-item .ni-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.notif-item .ni-body{flex:1}.notif-item .ni-body h4{font-size:14px;font-weight:600}.notif-item .ni-body p{font-size:13px;color:var(--text2);margin-top:2px}
.notif-item .ni-time{font-size:11px;color:var(--text3);flex-shrink:0}
.plan-card{background:linear-gradient(135deg,#1A1200,#221A08,#1A1D2A);border:1px solid rgba(255,109,0,.2);border-radius:var(--rl);padding:28px;position:relative;overflow:hidden}
.plan-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,109,0,.08),transparent 70%);border-radius:50%}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle-switch{position:relative;width:48px;height:26px;background:var(--bg);border-radius:13px;cursor:pointer;transition:background .2s;border:1px solid var(--border);flex-shrink:0}
.toggle-switch.on{background:var(--accent-d);border-color:var(--accent)}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text2);transition:all .2s}
.toggle-switch.on::after{left:25px;background:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:28px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:20px;font-weight:800;margin-bottom:20px}
.toast-container{position:fixed;top:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{padding:14px 20px;border-radius:var(--rs);font-size:14px;font-weight:500;animation:slideIn .3s ease;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;min-width:260px}
.toast-success{background:#0D2818;border:1px solid rgba(0,230,118,.3);color:var(--accent)}
.toast-info{background:#0D1F2D;border:1px solid rgba(64,196,255,.3);color:var(--info)}
.toast-error{background:#2D0D0D;border:1px solid rgba(255,82,82,.3);color:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.fade-up{animation:fadeUp .5s ease both}
.typing-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);display:inline-block;animation:pulse 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:100;padding:6px 0 env(safe-area-inset-bottom)}
.bottom-nav .bn-row{display:flex;justify-content:space-around}
.bottom-nav .bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;font-size:10px;color:var(--text3);transition:color .2s;position:relative}
.bottom-nav .bn-btn i{font-size:18px}
.bottom-nav .bn-btn.active{color:var(--accent)}
.bottom-nav .bn-btn .badge{position:absolute;top:2px;right:4px;width:7px;height:7px;background:var(--danger);border-radius:50%}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-h) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--rs)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.chat-list{width:240px}}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px 16px 100px}
  .bottom-nav{display:block}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .chat-layout{flex-direction:column;height:auto}.chat-list{width:100%;max-height:240px;border-right:none;border-bottom:1px solid var(--border)}
  .chat-main{min-height:400px}
  .form-row{grid-template-columns:1fr}
  .player-img{height:35vh;min-height:240px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

db.version(1).stores({
  user: 'id',
  workouts: 'id',
  nutrition: 'id',
  health: 'id',
  progress: 'id',
  messages: 'id',
  notifications: 'id',
  subscription: 'id',
  activity: 'id',
  initialized: 'key'
});

const state = {
  route: m.route.param,
  currentRoute: 'dashboard',
  sidebarOpen: false,
  workoutLayout: 'grid',
  workoutPlayer: null, // { workout, exerciseIdx, setIdx, paused, restTimer, restTimeLeft, workoutTimer, workoutTime, finished }
  celebration: null,
  modal: null, // { type, data }
  toasts: [],
  profileEdit: null,
  chartInstances: {},
  messageInput: {},
  selectedConversation: null,
  progressFilter: 'week',
  editingHealth: null
};

// ========== INITIALIZATION ==========
async function initApp() {
  const initialized = await db.initialized.get('done');
  if (!initialized) {
    await db.user.put(SEED_DATA.user);
    await db.workouts.bulkPut(SEED_DATA.workouts);
    await db.nutrition.put({ id: 1, ...SEED_DATA.nutrition });
    await db.health.put({ id: 1, ...SEED_DATA.health });
    await db.progress.put({ id: 1, ...SEED_DATA.progress });
    for (const m of SEED_DATA.messages) await db.messages.put(m);
    await db.notifications.bulkPut(SEED_DATA.notifications);
    await db.subscription.put({ id: 1, ...SEED_DATA.subscription });
    await db.activity.bulkPut(SEED_DATA.recentActivity);
    await db.initialized.put({ key: 'done', value: true });
  }
}

function showToast(msg, type = 'success') {
  const id = Date.now();
  state.toasts.push({ id, msg, type });
  m.redraw();
  setTimeout(() => { state.toasts = state.toasts.filter(t => t.id !== id); m.redraw(); }, 3000);
}

function diffTag(d) {
  const m = { Beginner:'tag-green', Intermediate:'tag-orange', Advanced:'tag-red' };
  return m[d] || 'tag-blue';
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

  state.currentRoute = route;

// ========== WORKOUT PLAYER ==========
function startWorkoutPlayer(workout, startIdx = 0) {
  state.workoutPlayer = {
    workout, exerciseIdx: startIdx, setIdx: 0, paused: false,
    restTimer: null, restTimeLeft: 0, workoutTimer: null, workoutTime: 0, finished: false
  };
  m.redraw();
}

const WorkoutPlayer = {
  oninit: () => {
    this.timerInterval = null;
    if (state.workoutPlayer && !state.workoutPlayer.finished) {
      this.startWorkoutTimer();
    }
  },
  onremove: () => {
    if (this.timerInterval) clearInterval(this.timerInterval);
    if (state.workoutPlayer && state.workoutPlayer.restTimer) clearInterval(state.workoutPlayer.restTimer);
  },
  startWorkoutTimer() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      if (!state.workoutPlayer || state.workoutPlayer.paused || state.workoutPlayer.finished) return;
      state.workoutPlayer.workoutTime++;
      m.redraw();
    }, 1000);
  },
  startRest(ex) {
    if (state.workoutPlayer.restTimer) clearInterval(state.workoutPlayer.restTimer);
    state.workoutPlayer.restTimeLeft = ex.restTime;
    state.workoutPlayer.restTimer = setInterval(() => {
      if (state.workoutPlayer.paused) return;
      state.workoutPlayer.restTimeLeft--;
      if (state.workoutPlayer.restTimeLeft <= 0) {
        clearInterval(state.workoutPlayer.restTimer);
        state.workoutPlayer.restTimeLeft = 0;
      }
      m.redraw();
    }, 1000);
  },
  nextSet() {
    const p = state.workoutPlayer;
    const ex = p.workout.exercises[p.exerciseIdx];
    p.setIdx++;
    if (p.setIdx >= ex.sets) {
      p.setIdx = 0;
      if (p.exerciseIdx < p.workout.exercises.length - 1) {
        p.exerciseIdx++;
        this.startRest(p.workout.exercises[p.exerciseIdx]);
      } else {
        this.finishWorkout();
      }
    } else {
      this.startRest(ex);
    }
    m.redraw();
  },
  prevExercise() {
    const p = state.workoutPlayer;
    if (p.exerciseIdx > 0) { p.exerciseIdx--; p.setIdx = 0; if (p.restTimer) clearInterval(p.restTimer); p.restTimeLeft = 0; m.redraw(); }
  },
  skipExercise() {
    const p = state.workoutPlayer;
    if (p.exerciseIdx < p.workout.exercises.length - 1) { p.exerciseIdx++; p.setIdx = 0; if (p.restTimer) clearInterval(p.restTimer); p.restTimeLeft = 0; m.redraw(); }
  },
  finishWorkout() {
    if (state.workoutPlayer.restTimer) clearInterval(state.workoutPlayer.restTimer);
    state.workoutPlayer.finished = true;
    const cals = Math.round(state.workoutPlayer.workoutTime * 6.5);
    state.celebration = { workout: state.workoutPlayer.workout, duration: state.workoutPlayer.workoutTime, calories: cals, exercisesCompleted: state.workoutPlayer.exercises.length, pr: ['Bench Press: 80kg x 8 (New PR!)', 'Squat: 100kg x 5 (Tied PR)'] };
    state.workoutPlayer = null;
    m.redraw();
  },
  view: () => {
    const p = state.workoutPlayer;
    if (!p) return null;
    const ex = p.workout.exercises[p.exerciseIdx];
    const totalSets = p.workout.exercises.reduce((a, e) => a + e.sets, 0);
    let doneSets = 0;
    for (let i = 0; i < p.exerciseIdx; i++) doneSets += p.workout.exercises[i].sets;
    doneSets += p.setIdx;
    const overallPct = Math.round((doneSets / totalSets) * 100);
    const exPct = Math.round((p.setIdx / ex.sets) * 100);
    return m('.player-wrap', [
      m('.player-img', { style: `background-image:url(${ex.thumbnail})` }),
      m('.player-body', [
        m('.flex.flex-between.flex-c.mb-16', [
          m('span.text-sm.text-muted', 'Exercise ' + (p.exerciseIdx + 1) + ' of ' + p.workout.exercises.length),
          m('.tag.tag-accent', p.workout.title)
        ]),

// ========== CELEBRATION ==========
const Celebration = {
  oncreate: (vnode) => {
    const canvas = vnode.dom.querySelector('.confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const colors = ['#00E676','#FF6D00','#40C4FF','#B388FF','#FF5252','#FFD600'];
    const particles = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 4, h: Math.random() * 6 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2, vx: (Math.random() - .5) * 2,
      rot: Math.random() * 360, vr: (Math.random() - .5) * 10
    }));
    let frame = 0;
    function animate() {
      if (frame > 300 || !state.celebration) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.vy; p.x += p.vx; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      frame++;
      requestAnimationFrame(animate);
    }
    animate();
  },
  view: () => {
    const c = state.celebration;
    if (!c) return null;
    return m('.celebration', [
      m('canvas.confetti-canvas'),
      m('div', { style: 'position:relative;z-index:1' }, [
        m('i.fa-solid fa-trophy', { style: 'font-size:64px;color:var(--accent2);margin-bottom:24px;display:block' }),
        m('h1', { style: 'font-size:36px;font-weight:900;margin-bottom:8px' }, 'Workout Complete!'),
        m('p.text-muted', { style: 'font-size:16px;margin-bottom:32px' }, 'Outstanding effort. Here\'s your summary.'),
        m('.grid.grid-3.gap-16.mb-32', { style: 'max-width:500px;margin:0 auto 32px' }, [
          m('.summary-stat', [ m('.ss-val.text-accent', c.calories), m('.ss-label', 'Calories') ]),
          m('.summary-stat', [ m('.ss-val.text-accent2', formatTime(c.duration)), m('.ss-label', 'Duration') ]),
          m('.summary-stat', [ m('.ss-val.text-info', c.exercisesCompleted), m('.ss-label', 'Exercises') ])
        ]),
        c.pr.length > 0 ? m('.card-flat.mb-32', { style: 'max-width:400px;margin:0 auto 32px' }, [
          m('h3.text-sm.text-accent2.mb-12', { style: 'text-transform:uppercase;letter-spacing:.5px' }, 'Personal Records'),
          ...c.pr.map(pr => m('.text-sm', { style: 'padding:6px 0;border-bottom:1px solid var(--border)' }, pr))
        ]) : null,
        m('.flex.gap-12.flex-c', [
          m('.btn.btn-primary.btn-lg', { onclick: () => { state.celebration = null; navigate('dashboard'); } }, 'Dashboard'),
          m('.btn.btn-secondary.btn-lg', { onclick: () => { state.celebration = null; navigate('progress'); } }, 'View History')
        ])

  }
};

const HealthDetailModal = {
  oninit: async (vnode) => { this.entry = ''; this.data = vnode.attrs.data; this.healthData = vnode.attrs.healthData; },
  view: () => {
    const d = this.data;
    let history = [];
    if (d.id === 'weight') history = this.healthData.weight.map(e => e.date + ': ' + e.value + ' kg');
    else if (d.id === 'bodyfat') history = this.healthData.bodyFat.map(e => e.date + ': ' + e.value + '%');
    else if (d.id === 'sleep') history = this.healthData.sleep.map(e => e.date + ': ' + e.value + ' hrs');
    else if (d.id === 'heartrate') history = this.healthData.heartRate.map(e => e.date + ': ' + e.value + ' bpm');
    else if (d.id === 'bp') history = this.healthData.bloodPressure.map(e => e.date + ': ' + e.systolic + '/' + e.diastolic + ' mmHg');
    else if (d.id === 'mood') history = this.healthData.mood.map(e => e.date + ': ' + e.value + '/5');
    else if (d.id === 'energy') history = this.healthData.energy.map(e => e.date + ': ' + e.value + '/10');
    return m('div', [
      m('.flex.flex-c.gap-16.mb-24', [
        m('.hc-icon', { style: `background:${d.color}15;color:${d.color};width:56px;height:56px;font-size:24px` }, m('i.fa-solid.' + d.icon)),
        m('div', [ m('h3', d.title), m('div', { style: 'font-family:var(--font-d);font-size:28px;font-weight:900;color:' + d.color }, d.value) ])
      ]),
      m('h4.text-sm.text-muted.mb-12', { style: 'text-transform:uppercase;letter-spacing:.5px' }, 'History'),
      m('.flex.flex-column.gap-8.mb-24', { style: 'max-height:200px;overflow-y:auto' },
        history.length > 0 ? history.map(h => m('.text-sm', { style: 'padding:8px 12px;background:var(--bg2);border-radius:var(--rs)' }, h)) : m('.text-muted.text-sm', 'No history recorded'))
      ,
      d.id !== 'bmi' ? m('.form-group', [ m('label', 'Add New Entry'), m('input', { placeholder: 'Enter value', type: 'number', step: '0.1', oninput: (e) => { this.entry = e.target.value; } }) ]) : null,
      d.id !== 'bmi' ? m('.btn.btn-primary.btn-block', { onclick: async () => {
        if (!this.entry) return showToast('Please enter a value', 'error');
        const h = await db.health.get(1);
        const today = new Date().toISOString().slice(0, 10);
        const val = parseFloat(this.entry);
        if (d.id === 'weight') { h.weight.push({ date: today, value: val }); const u = await db.user.get(1); u.weight = val; await db.user.put(u); }
        else if (d.id === 'bodyfat') { h.bodyFat.push({ date: today, value: val }); const u = await db.user.get(1); u.bodyFat = val; await db.user.put(u); }
        else if (d.id === 'sleep') h.sleep.push({ date: today, value: val });
        else if (d.id === 'heartrate') h.heartRate.push({ date: today, value: val });
        else if (d.id === 'bp') h.bloodPressure.push({ date: today, systolic: Math.round(val), diastolic: Math.round(val * 0.65) });
        else if (d.id === 'mood') h.mood.push({ date: today, value: Math.min(5, Math.max(1, Math.round(val))) });
        else if (d.id === 'energy') h.energy.push({ date: today, value: Math.min(10, Math.max(1, Math.round(val))) });
        await db.health.put(h);
        state.modal = null;
        showToast('Entry added successfully!');
      } }, 'Add Entry') : null
    ]);

// ========== ROUTER ==========
function resolveRoute() {
  const r = state.currentRoute;
  if (r.startsWith('workoutDetail/')) return { component: WorkoutDetail, attrs: { id: r.split('/')[1] } };
  const map = { dashboard: Dashboard, workouts: Workouts, progress: Progress, nutrition: Nutrition, health: Health, messages: Messages, subscription: Subscription, profile: Profile, notifications: Notifications, support: Support };
  return map[r] ? { component: map[r], attrs: {} } : { component: Dashboard, attrs: {} };
}

      m(Sidebar),
      m('main.main', [
        m(route.component, route.attrs)
      ]),
      state.workoutPlayer ? m(WorkoutPlayer) : null,
      state.celebration ? m(Celebration) : null,
      state.modal ? m(Modal) : null,
      m(Toasts),
      m(BottomNav),
      // Sidebar overlay for mobile
      state.sidebarOpen ? m('.modal-overlay', { style: 'z-index:99', onclick: () => { state.sidebarOpen = false; } }) : null
    ]);
  }
};

// ========== BOOT ==========
initApp().then(() => {
  m.mount(document.getElementById('app'), App);
});
</script>
</body>
</html>
